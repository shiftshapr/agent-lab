name: CKA gates

# Runs the CKA / monuments gate suite on every PR and push to main that touches the monuments tree.
# "Green" here is the merge bar for CKA PRs (projects/monuments/cka/docs/POLICY.md, section 9).

on:
  pull_request:
    paths:
      - "projects/monuments/**"
      - ".github/workflows/cka-gates.yml"
  push:
    branches: [main]
    paths:
      - "projects/monuments/**"
      - ".github/workflows/cka-gates.yml"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest

      - name: Preflight (CKA)
        run: python3 projects/monuments/scripts/dia_preflight.py --monument cka
      - name: Preflight self-test
        run: python3 projects/monuments/scripts/dia_preflight.py --self-test
      - name: Hostile hard gates (CKA)
        run: |
          python3 projects/monuments/scripts/hostile_hard_gates.py --monument cka --json /tmp/hostile.json > /dev/null
          python3 -c "import json,sys; d=json.load(open('/tmp/hostile.json')); c=d['counts']; print(c); sys.exit(1 if c['P0'] or c['P1'] else 0)"
      - name: Preflight (Bride of Charlie)
        run: python3 projects/monuments/scripts/dia_preflight.py --monument bride_of_charlie
      - name: Unit tests
        run: python3 -m pytest -q projects/monuments/scripts

      # Derived files must match the drafts: regenerate them and fail on any change
      # (the companion's generated_at timestamp is ignored).
      - name: Derived files are fresh
        run: |
          python3 projects/monuments/cka/scripts/apply_name_corrections.py
          python3 projects/monuments/cka/scripts/sync_claim_tags.py
          python3 projects/monuments/scripts/cka_brc222_companion.py > /dev/null
          if ! git diff --exit-code -I 'generated_at' --stat; then
            echo "::error::Derived files are stale. Run apply_name_corrections.py, sync_claim_tags.py and cka_brc222_companion.py, then commit the result."
            exit 1
          fi
